info:
  name: selectionner deux produits random
  type: http
  seq: 3

http:
  method: GET
  url: "{{url}}/public/products"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("check code 200",()=>{
          expect(res.getStatus()).equals(200);
        })

        test("sélectionner deux produits random", function () {
            
          let liste = res.getBody().products;

          let p1;
          let p2;
          
          while (!p1 || p1.stock <= 4) {
            p1 = liste[Math.floor(Math.random() * liste.length)];
          }

          while (!p2 || p2.stock <= 4 || p2.id === p1.id) {
            p2 = liste[Math.floor(Math.random() * liste.length)];
          }

          bru.setCollectionVar("id_product1", p1.id);
          bru.setCollectionVar("id_product2", p2.id);
          
          bru.setCollectionVar("stock_product1", p1.stock);
          bru.setCollectionVar("stock_product2", p2.stock);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
